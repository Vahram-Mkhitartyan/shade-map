[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shade-app"
version = "0.0.1"
description = "A solar and geometry core for shade-aware pedestrian routing"
requires-python = ">=3.9"
dependencies = [
    "pvlib>=0.10,<0.14",
    "pandas>=1.3,<3",
    "numpy>=1.24,<3",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
